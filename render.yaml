# Render Blueprint — OMS Django API
# Dashboard: Root Directory = backend
services:
  - type: web
    name: oms-backend
    runtime: python
    rootDir: backend
    plan: free
    region: oregon
    buildCommand: pip install -r requirements.txt && playwright install --with-deps chromium
    startCommand: python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT
    healthCheckPath: /api/core/health/
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://fyntech-oms.vercel.app
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-10"
      # Without this, `playwright install` (build step) and the app
      # launching the browser (runtime) can resolve to different homedir
      # cache paths on Render's infra, so the binary that got installed
      # during build is "missing" at runtime - this pins both to the same
      # path, inside the app itself rather than a user-level cache dir.
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: "0"
