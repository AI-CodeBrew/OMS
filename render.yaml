# Render Blueprint — OMS Django API
#
# Docker, not the native Python buildpack - switched specifically because
# Playwright's Chromium needs `apt-get install` for its system libraries,
# and the native buildpack's build step doesn't run as root, so that
# install silently failed and the browser was never actually present at
# runtime (not a path/cache issue - nothing was ever downloaded). Docker
# builds as root by default, which is what makes this actually work.
# The Dockerfile itself already runs collectstatic at build time, so no
# separate buildCommand/startCommand are needed here.
services:
  - type: web
    name: oms-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: oregon
    healthCheckPath: /api/core/health/
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        value: https://fyntech-oms.vercel.app
      - key: PUBLIC_BACKEND_URL
        sync: false
      - key: SHOPIFY_API_VERSION
        value: "2024-10"
